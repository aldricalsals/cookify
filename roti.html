<head>

    <title>Roti</title>
</head>
<body>
    <nav>
        <div class="header-item">
            <a href="index.html">
                <img src="back.png" alt="Home">
            </a>
        </div>

        <div class="acc">
            <a href="akun.html">  <!-- arahkan ke halaman yang kamu mau -->
            <img src="acc.png" alt="Akun"></a>
        </div>
    </nav>

    <div class="container">

        <h2>Olahan Roti</h2>

        <div class="product-grid">
            
            <div class="product-card">
                <a href="rotigorengisi.html" class="img-link">
                    <img src="rotigorengisi.png" alt="">
                </a>
                <div class="product-name">Roti Goreng Isi</div>
                <div class="product-category">cress lembut gurih</div>
                <div class="favorite-btn">♡</div>
            </div>

            <div class="product-card">
                <a href="rotigorengcoklat.html" class="img-link">
                    <img src="rotigorengcoklat.png" alt="">
                </a>
                <div class="product-name">Roti Goreng Isi Coklat</div>
                <div class="product-category">lumer lembut gurih</div>
                <div class="favorite-btn">♡</div>
            </div>

            <div class="product-card">
                <a href="rotipizza.html" class="img-link">
                    <img src="rotipizza.png" alt="">
                </a>
                <div class="product-name">Roti Pizza</div>
                <div class="product-category">lembut creamy</div>
                <div class="favorite-btn">♡</div>
            </div>

            <div class="product-card">
                <a href="rotitelur.html" class="img-link">
                    <img src="rotitelur.png" alt="">
                </a>
                <div class="product-name">Roti Telur</div>
                <div class="product-category">lembut dan gurih creamy</div>
                <div class="favorite-btn">♡</div>
            </div>

            <div class="product-card">
                <a href="rotitawargulung.html" class="img-link">
                    <img src="rotitawargulung.png" alt="">
                </a>
                <div class="product-name">Roti Tawar Gulung</div>
                <div class="product-category">renyah dan lembut</div>
                <div class="favorite-btn">♡</div>
            </div>

            <div class="product-card">
                <a href="rotiisiubi.html" class="img-link">
                    <img src="rotiisiubi.png" alt="">
                </a>
                <div class="product-name">Roti Isi Ubi</div>
                <div class="product-category">renyah dan lembut</div>
                <div class="favorite-btn">♡</div>
            </div>


    </div>

    <script>
            document.querySelectorAll(".favorite-btn").forEach(btn => {
                btn.addEventListener("click", function(e) {
                    e.stopPropagation();  // supaya tidak klik card

                    this.classList.toggle("active");

                    // Ubah ikon ♥ (merah) dan ♡ (kosong)
                    if (this.classList.contains("active")) {
                        this.textContent = "♥️";
                    } else {
                        this.textContent = "♡";
                    }
                });
            });
        </script>

        <script>
document.querySelectorAll(".favorite-btn").forEach(btn => {
    btn.addEventListener("click", function(event) {
        event.stopPropagation(); // cegah klik <a>
        event.preventDefault();  // cegah pindah halaman
        btn.classList.toggle("active");
        btn.innerText = btn.classList.contains("active") ? "❤️" : "♡";
    });
});
</script>
