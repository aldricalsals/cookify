<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar | Cookify</title>
    <link rel="stylesheet" href="signup.css">
</head>
<body>

    <div class="register-container">
        <h2>Daftar Akun</h2>

        <form action="#">
            <div class="input-box">
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" placeholder="Masukkan nama lengkap" required>
            </div>

            <div class="input-box">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Masukkan email" required>
            </div>

            <div class="input-box">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Masukkan password" required>
            </div>

            <div class="input-box">
                <label for="confirm">Konfirmasi Password</label>
                <input type="password" id="confirm" placeholder="Ulangi password" required>
            </div>

            <button type="submit" class="btn-register">Daftar</button>

            <p class="login-text">
                Sudah punya akun? <a href="login.html">Login</a>
            </p>
        </form>
    </div>

    <script src="signup.js"></script>

<script>
    document.querySelector('form').addEventListener('submit', function(e) {
        e.preventDefault(); 

        const nama = document.getElementById('nama').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirm').value;
        const errorBox = document.getElementById('regError'); 

        if (password !== confirm) {
            if(errorBox) {
                errorBox.innerText = "Password tidak cocok!";
                errorBox.style.display = "block";
            } else {
                alert("Password tidak cocok!");
            }
            return;
        }

        registerUser(nama, email, password);
        window.location.href = "login.html";
    });
</script>
   
</body>
</html>
