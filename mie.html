                   <!-- POPUP -->
            <div class="overlay hide" id="popup">
                <div class="popup-card">
                    <span class="close-btn" id="closePopup">✕</span>
                    <span class="popup-favorite" id="popupFavorite">♡</span>

                    <h2 id="popupTitle"></h2>
                    <p id="popupDesc"></p>

                    <img id="popupImg" class="popup-img">

                    <div class="recipe-info">
                        <div class="info-item">⏱️ <span>45 Menit</span></div>
                        <div class="info-item">🍽️ <span>1 Porsi</span></div>
                    </div>

                    <h3>Bahan</h3>
                    <ul id="popupBahan"></ul>

                    <h3>Cara Memasak</h3>
                    <ol id="popupLangkah"></ol>
                </div>
            </div>

<script>
        const popup = document.getElementById("popup");
        const popupFavorite = document.getElementById("popupFavorite");
        const closePopup = document.getElementById("closePopup");

        let activeCard = null;
        let favorites = JSON.parse(localStorage.getItem("favorites")) || [];

        document.querySelectorAll(".product-card").forEach(card => {
            const id = card.dataset.id;
            const btn = card.querySelector(".favorite-btn");

            if (favorites.some(item => item.id === id)) {
                btn.textContent = "❤️";
                btn.classList.add("active");
            } else {
                btn.textContent = "♡";
                btn.classList.remove("active");
            }
        });

        document.querySelectorAll(".open-popup").forEach(card => {
            card.addEventListener("click", () => {
                activeCard = card;

                popup.classList.remove("hide");

                popupTitle.innerText = card.dataset.title;
                popupDesc.innerText = card.dataset.desc;
                popupImg.src = card.dataset.img;
                popupBahan.innerHTML = card.dataset.bahan;
                popupLangkah.innerHTML = card.dataset.langkah;

                const id = card.dataset.id;
                popupFavorite.textContent =
                    favorites.some(item => item.id === id) ? "❤️" : "♡";
            });
        });

        // tombol close
        closePopup.onclick = () => popup.classList.add("hide");
        popup.onclick = () => popup.classList.add("hide");
        document.querySelector(".popup-card").onclick = e => e.stopPropagation();

        // klik love popup
        popupFavorite.onclick = e => {
            e.stopPropagation();

            const id = activeCard.dataset.id;
            const btnCard = activeCard.querySelector(".favorite-btn");
            const index = favorites.findIndex(item => item.id === id);

            if (index === -1) {
                favorites.push({
                    id,
                    title: activeCard.dataset.title,
                    desc: activeCard.dataset.desc,
                    img: activeCard.dataset.img
                });
                popupFavorite.textContent = "❤️";
                btnCard.textContent = "❤️";
                btnCard.classList.add("active");
            } else {
                favorites.splice(index, 1);
                popupFavorite.textContent = "♡";
                btnCard.textContent = "♡";
                btnCard.classList.remove("active");
            }

            localStorage.setItem("favorites", JSON.stringify(favorites));
        };

        // klik love langsung di card (LIST RESEP)
document.querySelectorAll(".favorite-btn").forEach(btn => {
    btn.addEventListener("click", e => {
        e.stopPropagation();

        const card = btn.closest(".product-card");
        const id = card.dataset.id;
        const index = favorites.findIndex(item => item.id === id);

        if (index === -1) {
            favorites.push({
                id,
                title: card.dataset.title,
                desc: card.dataset.desc,
                img: card.dataset.img
            });
            btn.textContent = "❤️";
            btn.classList.add("active");
        } else {
            favorites.splice(index, 1);
            btn.textContent = "♡";
            btn.classList.remove("active");
        }

        localStorage.setItem("favorites", JSON.stringify(favorites));
    });
});

    </script>
